# ============================================================================
# Ganimation Studio - Minimal Docker Compose (Streamlit + ComfyUI)
# ============================================================================

services:
  comfyui:
    build:
      context: .
      dockerfile: docker/Dockerfile.comfyui
    container_name: ganimation-comfyui
    restart: unless-stopped

    environment:
      - NVIDIA_TF32_OVERRIDE=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - HF_HOME=/opt/ComfyUI/user/hf_cache

    env_file:
      - .env

    gpus: all

    volumes:
      - ./data/comfyui/models:/opt/ComfyUI/models
      - ./data/comfyui/output:/opt/ComfyUI/output
      - ./data/comfyui/input:/opt/ComfyUI/input
      - ./data/comfyui/user:/opt/ComfyUI/user
      - ./data/comfyui/custom_nodes:/opt/ComfyUI/custom_nodes

    ports:
      - "8188:8188"

    networks:
      - ganimation-studio

  studio:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    container_name: ganimation-studio
    restart: unless-stopped

    environment:
      - COMFYUI_HOST=comfyui
      - COMFYUI_PORT=8188
      - COMFYUI_INPUT_DIR=/app/data/comfyui/input
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_THEME_BASE=dark

    volumes:
      # Persist user media outside of Docker
      - ./gallery:/app/gallery
      - ./temp:/app/temp
      - ./models:/app/models
      - ./data/comfyui/input:/app/data/comfyui/input
      - ./data/comfyui/user/default/workflows:/app/data/comfyui/user/default/workflows

    ports:
      - "8501:8501"

    networks:
      - ganimation-studio

    depends_on:
      - comfyui

networks:
  ganimation-studio:
    driver: bridge
