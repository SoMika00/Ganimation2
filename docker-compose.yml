# ============================================================================
# Ganimation Studio - Docker Compose
# Multi-service architecture optimized for 2x NVIDIA H100
# ============================================================================

version: "3.9"

services:
  # ==========================================================================
  # API Service - FastAPI Backend (GPU-enabled)
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: ganimation-api
    restart: unless-stopped
    
    # GPU Configuration for H100
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all  # Use both H100 GPUs
              capabilities: [gpu]
    
    environment:
      - CUDA_VISIBLE_DEVICES=0,1
      - NVIDIA_TF32_OVERRIDE=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - TORCH_CUDA_ARCH_LIST=9.0
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_WORKERS=2
      - LOG_LEVEL=info
      - DATA_DIR=/data
      - MODELS_DIR=/data/models
      - GALLERY_DIR=/data/gallery
      - TEMP_DIR=/data/temp
    
    volumes:
      - gallery_data:/data/gallery
      - temp_data:/data/temp
      - models_data:/data/models
      - ./api:/app/api:ro  # Mount for development
      - ./utils:/app/utils:ro
    
    ports:
      - "8000:8000"
    
    networks:
      - ganimation-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  # ==========================================================================
  # Frontend Service - Streamlit UI
  # ==========================================================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ganimation-frontend
    restart: unless-stopped
    
    environment:
      - API_URL=http://api:8000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_THEME_BASE=dark
    
    volumes:
      - gallery_data:/data/gallery:ro  # Read-only access to gallery
      - ./pages:/app/pages:ro  # Mount for development
    
    ports:
      - "8501:8501"
    
    networks:
      - ganimation-network
    
    depends_on:
      api:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ==========================================================================
  # Worker Service - Background Tasks (GPU-enabled)
  # ==========================================================================
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: ganimation-worker
    restart: unless-stopped
    
    # GPU Configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    environment:
      - CUDA_VISIBLE_DEVICES=0,1
      - NVIDIA_TF32_OVERRIDE=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - WORKER_MODE=true
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/data
      - MODELS_DIR=/data/models
    
    volumes:
      - gallery_data:/data/gallery
      - temp_data:/data/temp
      - models_data:/data/models
    
    networks:
      - ganimation-network
    
    depends_on:
      - redis
      - api
    
    command: ["python", "-m", "api.worker"]
    
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  # ==========================================================================
  # Redis - Task Queue & Cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: ganimation-redis
    restart: unless-stopped
    
    volumes:
      - redis_data:/data
    
    ports:
      - "6379:6379"
    
    networks:
      - ganimation-network
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru

  # ==========================================================================
  # Nginx - Reverse Proxy (Production)
  # ==========================================================================
  nginx:
    image: nginx:alpine
    container_name: ganimation-nginx
    restart: unless-stopped
    
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro  # For HTTPS
    
    ports:
      - "80:80"
      - "443:443"
    
    networks:
      - ganimation-network
    
    depends_on:
      - api
      - frontend
    
    profiles:
      - production

# ============================================================================
# Networks
# ============================================================================
networks:
  ganimation-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================================================
# Volumes
# ============================================================================
volumes:
  gallery_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/gallery
  
  temp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/temp
  
  models_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/models
  
  redis_data:
    driver: local

